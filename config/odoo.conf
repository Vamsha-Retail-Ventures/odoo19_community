[options]
; Paths (Supports Codespaces /workspace and official /mnt/extra-addons)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/workspace/custom_addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; Security
admin_passwd = ${ODOO_ADMIN_PASSWD}

; Network & Ports (Odoo 19 Naming Convention)
http_port = 8069
gevent_port = 8072
proxy_mode = True

; Development Logging & Time Limits
log_level = info
limit_time_cpu = 600
limit_time_real = 1200

; --- Multi-Worker Production Scaling Presets (Uncomment for Production / Load Testing) ---
; workers = 2
; limit_memory_hard = 2684354560
; limit_memory_soft = 2147483648
; limit_request = 8192
