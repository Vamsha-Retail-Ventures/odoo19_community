[options]
; Paths
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/workspace/custom_addons
data_dir = /var/lib/odoo

; Security
admin_passwd = ${ODOO_ADMIN_PASSWD}

; Network & Ports (Odoo 19 Naming Convention)
http_port = 8069
gevent_port = 8072
proxy_mode = True

; Development Logging & Time Limits
log_level = info
limit_time_cpu = 600
limit_time_real = 1200
